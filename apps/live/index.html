<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Eleagent Live</title>
  <link rel="stylesheet" href="/live/live.css">
  <script src="/live/assets/asr/sherpa-onnx-asr.js"></script>
  <script src="/live/live-asr.js"></script>
  <script src="/live/assets/asr/sherpa-onnx-wasm-main-asr.js" defer></script>
  <script type="module" src="/live/live.js"></script>
</head>
<body>
  <main>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <p id="caption" class="caption" aria-live="polite"><span id="final"></span><span id="partial"></span></p>
    <pre id="hud" class="hud"></pre>
    <div class="controls">
      <select id="detect-size" aria-label="Detection size">
        <option value="320">320</option>
        <option value="480" selected>480</option>
        <option value="640">640</option>
        <option value="0">full</option>
      </select>
      <button id="start" class="start">Start</button>
      <button id="flip" class="flip" aria-label="Switch camera" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 10.5A7.6 7.6 0 0 0 6 6.3L4.5 7.8"/><path d="M4.5 3.5v4.3h4.3"/><path d="M4.5 13.5A7.6 7.6 0 0 0 18 17.7l1.5-1.5"/><path d="M19.5 20.5v-4.3h-4.3"/></svg>
      </button>
    </div>
  </main>
</body>
</html>
